# Continuous deployment generated by secretkit (Cloudflare host). The gate job
# (test) runs on every push to a deploy branch AND on pull_request, so a
# promotion PR is proven green before merge; the deploy job is push-only. The
# two deploy bootstrap creds are GitHub *Environment* secrets (from 1Password);
# public bundle vars come from committed .env.<mode> files, not secrets.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test gate
        run: pnpm test

  deploy:
    name: Deploy production
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ships into the client bundle by design (Vite), so it is a weak gate,
          # not a real access control. Sourced from the production Environment
          # secret so it is never committed. Rotated 2026-09-03 (P-2-2026-09-04).
          VITE_ADMIN_PASSPHRASE: ${{ secrets.VITE_ADMIN_PASSPHRASE }}
          BUILD_MODE: production
        run: |
          pnpm exec convex deploy
          pnpm build:"$BUILD_MODE" || pnpm build
          pnpm exec wrangler deploy
